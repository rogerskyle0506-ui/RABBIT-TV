name: Build Fire TV Edition APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 22 Required for TanStack Start)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Required for Gradle/Android Compilation)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Extract App Name & Version
        id: version-extractor
        run: |
          APP_NAME=$(node -p "require('./package.json').name || 'RABBiT-TV'")
          VERSION=$(node -p "require('./package.json').version || '1.0.0'")
          
          SLUG=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr '/' '-' | tr ' ' '-')
          
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "app_version=$VERSION" >> $GITHUB_OUTPUT
          echo "artifact_name=${SLUG}-firetv-v${VERSION}" >> $GITHUB_OUTPUT
          echo "apk_filename=${SLUG}-firetv-v${VERSION}.apk" >> $GITHUB_OUTPUT
          
          echo "Building Fire TV Edition: $APP_NAME version$VERSION"

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor CLI, Android & Assets Packages
        run: npm install @capacitor/cli@^6 @capacitor/android@^6 @capacitor/assets --save-dev

      - name: Verify Capacitor Config & Icon Exists
        run: |
          if [ ! -f capacitor.config.json ]; then
            echo "Error: capacitor.config.json is missing!"
            exit 1
          fi
          if [ ! -f assets/icon.png ]; then
            echo "Error: assets/icon.png is missing!"
            exit 1
          fi

      - name: Generate Provider Route & Inject Navigation Cleanly
        run: |
          mkdir -p src/routes
          
          # 1. Write the provider route file safely
          cat << 'EOF' > src/routes/providers.$providerId.tsx
          import { createFileRoute, Link } from '@tanstack/react-router'
          import { useState, useEffect } from 'react'

          export const Route = createFileRoute('/providers/$providerId')({
            component: ProviderMoviesPage,
          })

          function ProviderMoviesPage() {
            const { providerId } = Route.useParams()
            const [movies, setMovies] = useState([])
            const [loading, setLoading] = useState(true)

            const providerNames = {
              '8': 'Netflix',
              '9': 'Prime Video',
              '337': 'Disney+'
            }

            const providerName = providerNames[providerId] || 'Streaming Provider'

            useEffect(() => {
              async function fetchProviderMovies() {
                setLoading(true)
                try {
                  const token = import.meta.env.VITE_TMDB_READ_TOKEN || ''
                  const apiKey = import.meta.env.VITE_TMDB_API_KEY || ''
                  
                  let url = `https://api.themoviedb.org/3/discover/movie?include_adult=false&include_video=false&language=en-US&page=1&sort_by=popularity.desc&with_watch_providers=${providerId}&watch_region=CA`
                  
                  const headers = { accept: 'application/json' }
                  if (token) {
                    headers['Authorization'] = `Bearer ${token}`
                  } else if (apiKey) {
                    url += `&api_key=${apiKey}`
                  }

                  let res = await fetch(url, { headers })
                  let data = await res.json()
                  
                  if (data && data.results && data.results.length > 0) {
                    setMovies(data.results)
                  } else {
                    let fallbackUrl = `https://api.themoviedb.org/3/movie/popular?language=en-US&page=1`
                    if (apiKey) fallbackUrl += `&api_key=${apiKey}`
                    res = await fetch(fallbackUrl, { headers })
                    data = await res.json()
                    setMovies(data && data.results ? data.results : [])
                  }
                } catch (err) {
                  console.error('Failed to fetch provider movies:', err)
                  setMovies([])
                } finally {
                  setLoading(false)
                }
              }
              fetchProviderMovies()
            }, [providerId])

            return (
              <div className="min-h-screen text-white p-6 pb-24">
                <div className="flex items-center justify-between mb-8">
                  <h1 className="text-3xl font-extrabold tracking-tight flex items-center gap-3">
                    <span className="text-violet-400">{providerName}</span> Catalog (Canada)
                  </h1>
                  <Link to="/" className="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-sm font-semibold rounded-full border border-white/10 transition">
                    ← Back to Home
                  </Link>
                </div>

                {loading ? (
                  <div className="flex items-center justify-center h-64">
                    <div className="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-violet-500"></div>
                  </div>
                ) : movies.length === 0 ? (
                  <div className="text-center py-20 text-slate-400">
                    <p className="text-lg">No movies found for {providerName} right now.</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                    {movies.map((movie) => (
                      <Link key={movie.id} to={`/movie/${movie.id}`} className="group flex flex-col bg-slate-900/60 rounded-xl overflow-hidden border border-white/10 hover:border-violet-500/50 transition transform hover:scale-105">
                        <div className="aspect-[2/3] w-full bg-slate-800 relative overflow-hidden">
                          {movie.poster_path ? (
                            <img 
                              src={`https://image.tmdb.org/t/p/w500${movie.poster_path}`} 
                              alt={movie.title} 
                              className="w-full h-full object-cover group-hover:opacity-90 transition"
                            />
                          ) : (
                            <div className="flex items-center justify-center h-full text-xs text-slate-500">No Image</div>
                          )}
                        </div>
                        <div className="p-3 flex flex-col flex-grow">
                          <h2 className="text-sm font-bold truncate text-white group-hover:text-violet-400 transition">{movie.title}</h2>
                          <p className="text-xs text-slate-400 mt-1">{movie.release_date ? movie.release_date.split('-')[0] : 'N/A'}</p>
                        </div>
                      </Link>
                    ))}
                  </div>
                )}
              </div>
            )
          }
          EOF

          # 2. Run clean Node script to inject header navigation safely
          node -e '
            const fs = require("fs");
            const rootPath = "src/routes/__root.tsx";
            if (fs.existsSync(rootPath)) {
              let rootContent = fs.readFileSync(rootPath, "utf8");
              const pillsHTML = `
                {/* Provider Pill Navigation */}
                <div className="hidden md:flex items-center gap-3">
                  <Link to="/" className="px-4 py-1.5 text-xs font-bold rounded-full bg-slate-800 text-slate-200 border border-white/10 hover:border-slate-500 transition">All</Link>
                  <Link to="/providers/8" className="px-4 py-1.5 text-xs font-extrabold rounded-full bg-gradient-to-r from-red-600 to-rose-900 text-white border border-red-500/40 shadow-md shadow-red-900/30 hover:scale-105 transition">Netflix</Link>
                  <Link to="/providers/9" className="px-4 py-1.5 text-xs font-extrabold rounded-full bg-gradient-to-r from-sky-600 to-blue-900 text-white border border-sky-500/40 shadow-md shadow-sky-900/30 hover:scale-105 transition">Prime Video</Link>
                  <Link to="/providers/337" className="px-4 py-1.5 text-xs font-extrabold rounded-full bg-gradient-to-r from-blue-700 to-indigo-900 text-white border border-blue-500/40 shadow-md shadow-blue-900/30 hover:scale-105 transition">Disney+</Link>
                </div>
              `;

              const targetAnchor = "RABBiT TV</span>\n              </Link>";
              if (rootContent.includes(targetAnchor) && !rootContent.includes("Provider Pill Navigation")) {
                rootContent = rootContent.replace(targetAnchor, targetAnchor + "\n\n              " + pillsHTML);
                fs.writeFileSync(rootPath, rootContent, "utf8");
                console.log("Successfully injected provider pills into header!");
              }
            }
          '

      - name: Build Web Assets for Capacitor
        env:
          CAPACITOR_BUILD: "true"
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          VITE_TMDB_READ_TOKEN: ${{ secrets.VITE_TMDB_READ_TOKEN }}
        run: npx vite build

      - name: Update Capacitor Config webDir to dist/client & Map Shell Index
        run: |
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            config.webDir = "dist/client";
            fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2), "utf8");
            console.log("Updated capacitor.config.json webDir to dist/client");
          '
          if [ -f dist/client/_shell.html ] && [ ! -f dist/client/index.html ]; then
            cp dist/client/_shell.html dist/client/index.html
            echo "Copied _shell.html to index.html"
          fi

      - name: Add Android Platform
        run: npx @capacitor/cli add android

      - name: Generate App Icons and Splash Screens from Standard Assets
        run: npx @capacitor/assets generate --android

      - name: Sync Capacitor
        run: npx @capacitor/cli sync android

      - name: Forcefully Write & Register Clean MainActivity (Viewport Fix Applied)
        run: |
          TARGET_DIR="android/app/src/main/java/com/rabbittv/app"
          mkdir -p "$TARGET_DIR"
          
          cat << 'EOF' > "$TARGET_DIR/MainActivity.java"
          package com.rabbittv.app;

          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private View mCustomView;
              private WebChromeClient.CustomViewCallback mCustomViewCallback;

              private final WebChromeClient customWebChromeClient = new WebChromeClient() {
                  @Override
                  public void onShowCustomView(View view, CustomViewCallback callback) {
                      if (mCustomView != null) {
                          callback.onCustomViewHidden();
                          return;
                      }
                      mCustomView = view;
                      mCustomViewCallback = callback;

                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE |
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                          View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                          View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                          View.SYSTEM_UI_FLAG_FULLSCREEN |
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      );

                      ViewGroup decorView = (ViewGroup) getWindow().getDecorView();
                      decorView.addView(mCustomView, new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      ));
                      if (bridge != null && bridge.getWebView() != null) {
                          bridge.getWebView().setVisibility(View.GONE);
                      }
                  }

                  @Override
                  public void onHideCustomView() {
                      if (mCustomView == null) return;

                      ViewGroup decorView = (ViewGroup) getWindow().getDecorView();
                      decorView.removeView(mCustomView);
                      mCustomView = null;
                      
                      if (mCustomViewCallback != null) {
                          mCustomViewCallback.onCustomViewHidden();
                      }

                      if (bridge != null && bridge.getWebView() != null) {
                          bridge.getWebView().setVisibility(View.VISIBLE);
                      }
                      getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                  }

                  @Override
                  public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, android.os.Message resultMsg) {
                      WebView.WebViewTransport transport = (WebView.WebViewTransport) resultMsg.obj;
                      transport.setWebView(view);
                      resultMsg.sendToTarget();
                      return true;
                  }
              };

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebView webView = this.bridge.getWebView();
                      
                      webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);

                      WebSettings settings = webView.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setMediaPlaybackRequiresUserGesture(false);
                      settings.setAllowFileAccess(true);
                      settings.setAllowContentAccess(true);
                      settings.setJavaScriptCanOpenWindowsAutomatically(true);
                      settings.setSupportMultipleWindows(true);
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                      settings.setLoadsImagesAutomatically(true);

                      webView.setWebChromeClient(customWebChromeClient);
                      
                      webView.setWebViewClient(new WebViewClient() {
                          @Override
                          public boolean shouldOverrideUrlLoading(WebView view, String url) {
                              view.loadUrl(url);
                              return true;
                          }
                      });
                  }
              }

              @Override
              public void onBackPressed() {
                  if (mCustomView != null) {
                      customWebChromeClient.onHideCustomView();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF
          echo "Successfully wrote clean MainActivity.java without viewport scaling bugs"

      - name: Copy TV Banner & Manifest Overrides
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/tv_banner.png android/app/src/main/res/drawable/tv_banner.png
          cp patches/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>

              <style name="AppTheme.NoActionBar" parent="AppTheme">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
              </style>

              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:windowBackground">#050b16</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/tv_banner</item>
                  <item name="android:windowSplashScreenBackground">#050b16</item>
              </style>
          </resources>
          EOF

      - name: Verify Android Directory Exists
        run: |
          if [ ! -d android ]; then
            echo "Error: android directory was not created!"
            exit 1
          fi

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Rename and Prepare APK Artifact
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/${{ steps.version-extractor.outputs.apk_filename }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version-extractor.outputs.artifact_name }}
          path: output_apk/${{ steps.version-extractor.outputs.apk_filename }}
