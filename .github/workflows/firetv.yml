name: Build Fire TV Edition APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 22 Required for TanStack Start)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Required for Gradle/Android Compilation)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Extract App Name & Version
        id: version-extractor
        run: |
          APP_NAME=$(node -p "require('./package.json').name || 'RABBiT-TV'")
          VERSION=$(node -p "require('./package.json').version || '1.0.0'")
          
          SLUG=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr '/' '-' | tr ' ' '-')
          
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "app_version=$VERSION" >> $GITHUB_OUTPUT
          echo "artifact_name=${SLUG}-firetv-v${VERSION}" >> $GITHUB_OUTPUT
          echo "apk_filename=${SLUG}-firetv-v${VERSION}.apk" >> $GITHUB_OUTPUT
          
          echo "Building Fire TV Edition: $APP_NAME version$VERSION"

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor CLI, Android & Assets Packages
        run: npm install @capacitor/cli@^6 @capacitor/android@^6 @capacitor/assets --save-dev

      - name: Verify Capacitor Config & Icon Exists
        run: |
          if [ ! -f capacitor.config.json ]; then
            echo "Error: capacitor.config.json is missing!"
            exit 1
          fi
          if [ ! -f assets/icon.png ]; then
            echo "Error: assets/icon.png is missing!"
            exit 1
          fi

      - name: Inject Interactive Provider Tabs & Navigation into __root.tsx
        run: |
          ROOT_FILE="src/routes/__root.tsx"
          if [ -f "$ROOT_FILE" ]; then
            echo "Patching $ROOT_FILE to include interactive Streaming Provider filter tabs..."
            node -e '
              const fs = require("fs");
              let content = fs.readFileSync("src/routes/__root.tsx", "utf8");
              
              // Native interactive filter bar using React state-friendly window dispatcher
              const providerNavJSX = `
                <div className="flex items-center gap-3 overflow-x-auto px-4 py-2.5 bg-slate-950/90 border-b border-white/10 shrink-0 z-50">
                  <span className="text-xs font-bold text-slate-400 tracking-wider">PROVIDERS:</span>
                  <button onClick={() => window.dispatchEvent(new CustomEvent("firetv-filter", {detail: "all"}))} className="px-3.5 py-1 text-xs font-semibold rounded-full bg-white/10 text-white hover:bg-red-600 transition cursor-pointer">All</button>
                  <button onClick={() => window.dispatchEvent(new CustomEvent("firetv-filter", {detail: "8"}))} className="px-3.5 py-1 text-xs font-semibold rounded-full bg-white/10 text-white hover:bg-red-600 transition cursor-pointer">Netflix</button>
                  <button onClick={() => window.dispatchEvent(new CustomEvent("firetv-filter", {detail: "9"}))} className="px-3.5 py-1 text-xs font-semibold rounded-full bg-white/10 text-white hover:bg-sky-500 transition cursor-pointer">Prime</button>
                  <button onClick={() => window.dispatchEvent(new CustomEvent("firetv-filter", {detail: "337"}))} className="px-3.5 py-1 text-xs font-semibold rounded-full bg-white/10 text-white hover:bg-blue-600 transition cursor-pointer">Disney+</button>
                </div>
              `;

              if (content.includes("<header")) {
                content = content.replace("<header", providerNavJSX + "\n<header");
              } else if (content.includes("<nav")) {
                content = content.replace("<nav", providerNavJSX + "\n<nav");
              } else {
                content = content.replace(/return\s*\(\s*<\w+>/, match => match + "\n" + providerNavJSX);
              }

              fs.writeFileSync("src/routes/__root.tsx", content, "utf8");
              console.log("Successfully patched __root.tsx with interactive provider tabs.");
            '
          else
            echo "Warning: src/routes/__root.tsx not found."
          fi

      - name: Create Temporary index.html with Floating Back Button & Player Detector
        run: |
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>RABBiT TV (Fire TV Edition)</title>
              <style>
                #firetv-back-to-home {
                  position: fixed !important;
                  top: 24px !important;
                  left: 24px !important;
                  z-index: 2147483647 !important;
                  background: rgba(15, 23, 42, 0.95) !important;
                  border: 2px solid rgba(168, 85, 247, 0.8) !important;
                  color: #ffffff !important;
                  padding: 12px 24px !important;
                  border-radius: 50px !important;
                  font-family: system-ui, -apple-system, sans-serif !important;
                  font-size: 16px !important;
                  font-weight: 700 !important;
                  cursor: pointer !important;
                  opacity: 0 !important;
                  pointer-events: none !important;
                  transition: opacity 0.25s ease-in-out, transform 0.2s ease !important;
                  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8) !important;
                }
                #firetv-back-to-home.visible {
                  opacity: 1 !important;
                  pointer-events: auto !important;
                }
                #firetv-back-to-home:hover, #firetv-back-to-home:focus {
                  background: rgba(168, 85, 247, 0.9) !important;
                  transform: scale(1.05) !important;
                }
              </style>
            </head>
            <body>
              <button id="firetv-back-to-home" onclick="if(window.history.length > 1){ window.history.back(); } else { window.location.replace('/'); }">
                ← Back to Home
              </button>
              <div id="root"></div>
              <script type="module" src="/src/entry-client.tsx"></script>
              <script>
                (function() {
                  let hideTimer;
                  function showBackButton() {
                    const hasPlayer = window.location.pathname.includes('/watch') || 
                                      window.location.pathname.includes('/player') || 
                                      document.querySelector('iframe, video, .video-player-container');
                    if (!hasPlayer) return;

                    const btn = document.getElementById('firetv-back-to-home');
                    if (!btn) return;

                    btn.classList.add('visible');
                    clearTimeout(hideTimer);
                    hideTimer = setTimeout(() => {
                      btn.classList.remove('visible');
                    }, 3500);
                  }

                  window.addEventListener('mousemove', showBackButton, { passive: true });
                  window.addEventListener('touchstart', showBackButton, { passive: true });
                  window.addEventListener('keydown', showBackButton, { passive: true });
                })();
              </script>
            </body>
          </html>
          EOF

      - name: Inject Corrected Non-Squished Player CSS into Stylesheet
        run: |
          if [ -f src/styles.css ]; then
            echo "" >> src/styles.css
            echo "/* ==========================================================" >> src/styles.css
            echo "   Fire TV Corrected Native Player Sizing" >> src/styles.css
            echo "   ================================================---------- */" >> src/styles.css
            
            # Let the player container fill available space naturally without 20% clipping
            echo "iframe, video, .video-player-container {" >> src/styles.css
            echo "  width: 100% !important;" >> src/styles.css
            echo "  height: 100% !important;" >> src/styles.css
            echo "  max-width: 100% !important;" >> src/styles.css
            echo "  max-height: 100% !important;" >> src/styles.css
            echo "  border: none !important;" >> src/styles.css
            echo "}" >> src/styles.css
            
            echo "Successfully injected corrected player styles into src/styles.css"
          else
            echo "Error: src/styles.css not found!"
            exit 1
          fi

      - name: Build Web Assets for Capacitor
        env:
          CAPACITOR_BUILD: "true"
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          VITE_TMDB_READ_TOKEN: ${{ secrets.VITE_TMDB_READ_TOKEN }}
        run: npx vite build

      - name: Map TanStack Shell to Capacitor index.html
        run: |
          if [ -f dist/client/_shell.html ]; then
            cp dist/client/_shell.html dist/client/index.html
            echo "Successfully copied _shell.html to index.html"
          elif [ ! -f dist/client/index.html ]; then
            echo "Error: Could not find _shell.html or index.html in dist/client"
            ls -R dist/ || true
            exit 1
          fi

      - name: Create Dummy www Folder for Capacitor Init
        run: |
          mkdir -p www
          cp dist/client/index.html www/index.html

      - name: Add Android Platform
        run: npx @capacitor/cli add android

      - name: Generate App Icons and Splash Screens from Standard Assets
        run: npx @capacitor/assets generate --android

      - name: Sync Capacitor
        run: npx @capacitor/cli sync android

      - name: Inject Custom MainActivity for Fire TV, TV Banner, Manifest & Clean Dark Splash Styles
        run: |
          mkdir -p android/app/src/main/java/com/rabbittv/app
          if [ -f patches/MainActivity.firetv.java ]; then
            cp patches/MainActivity.firetv.java android/app/src/main/java/com/rabbittv/app/MainActivity.java
          else
            cp patches/MainActivity.java android/app/src/main/java/com/rabbittv/app/MainActivity.java
          fi

          mkdir -p android/app/src/main/res/drawable
          cp assets/tv_banner.png android/app/src/main/res/drawable/tv_banner.png

          cp patches/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>

              <style name="AppTheme.NoActionBar" parent="AppTheme">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
              </style>

              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:windowBackground">#050b16</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/tv_banner</item>
                  <item name="android:windowSplashScreenBackground">#050b16</item>
              </style>
          </resources>
          EOF

      - name: Verify Android Directory Exists
        run: |
          if [ ! -d android ]; then
            echo "Error: android directory was not created!"
            exit 1
          fi

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Rename and Prepare APK Artifact
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/${{ steps.version-extractor.outputs.apk_filename }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version-extractor.outputs.artifact_name }}
          path: output_apk/${{ steps.version-extractor.outputs.apk_filename }}
