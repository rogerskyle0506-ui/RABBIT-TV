name: Build Fire TV Edition APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 22 Required for TanStack Start)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Required for Gradle/Android Compilation)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Extract App Name & Version
        id: version-extractor
        run: |
          APP_NAME=$(node -p "require('./package.json').name || 'RABBiT-TV'")
          VERSION=$(node -p "require('./package.json').version || '1.0.0'")
          
          SLUG=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr '/' '-' | tr ' ' '-')
          
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "app_version=$VERSION" >> $GITHUB_OUTPUT
          echo "artifact_name=${SLUG}-firetv-v${VERSION}" >> $GITHUB_OUTPUT
          echo "apk_filename=${SLUG}-firetv-v${VERSION}.apk" >> $GITHUB_OUTPUT
          
          echo "Building Fire TV Edition: $APP_NAME version$VERSION"

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor CLI, Android & Assets Packages
        run: npm install @capacitor/cli@^6 @capacitor/android@^6 @capacitor/assets --save-dev

      - name: Verify Capacitor Config & Icon Exists
        run: |
          if [ ! -f capacitor.config.json ]; then
            echo "Error: capacitor.config.json is missing!"
            exit 1
          fi
          if [ ! -f assets/icon.png ]; then
            echo "Error: assets/icon.png is missing!"
            exit 1
          fi

      - name: Generate Dynamic Provider Route & Patch __root.tsx
        run: |
          # 1. Create the dynamic provider route file so TanStack Router compiles it
          mkdir -p src/routes
          cat << 'EOF' > src/routes/providers.$providerId.tsx
          import { createFileRoute, Link } from '@tanstack/react-router'
          import { useState, useEffect } from 'react'

          export const Route = createFileRoute('/providers/$providerId')({
            component: ProviderMoviesPage,
          })

          function ProviderMoviesPage() {
            const { providerId } = Route.useParams()
            const [movies, setMovies] = useState([])
            const [loading, setLoading] = useState(true)

            const providerNames = {
              '8': 'Netflix',
              '9': 'Prime Video',
              '337': 'Disney+'
            }

            const providerName = providerNames[providerId] || 'Streaming Provider'

            useEffect(() => {
              async function fetchProviderMovies() {
                setLoading(true)
                try {
                  const token = import.meta.env.VITE_TMDB_READ_TOKEN || ''
                  const apiKey = import.meta.env.VITE_TMDB_API_KEY || ''
                  
                  let url = `https://api.themoviedb.org/3/discover/movie?with_watch_providers=${providerId}&watch_region=CA&sort_by=popularity.desc`
                  
                  const headers = { accept: 'application/json' }
                  if (token) {
                    headers['Authorization'] = `Bearer ${token}`
                  } else if (apiKey) {
                    url += `&api_key=${apiKey}`
                  }

                  const res = await fetch(url, { headers })
                  const data = await res.json()
                  if (data && data.results) {
                    setMovies(data.results)
                  }
                } catch (err) {
                  console.error('Failed to fetch provider movies:', err)
                } finally {
                  setLoading(false)
                }
              }
              fetchProviderMovies()
            }, [providerId])

            return (
              <div className="min-h-screen bg-[#050b16] text-white p-6 pb-24">
                <div className="flex items-center justify-between mb-8">
                  <h1 className="text-3xl font-extrabold tracking-tight flex items-center gap-3">
                    <span className="text-purple-400">{providerName}</span> Movies
                  </h1>
                  <Link to="/" className="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-sm font-semibold rounded-full border border-white/10 transition">
                    ← Back to Home
                  </Link>
                </div>

                {loading ? (
                  <div className="flex items-center justify-center h-64">
                    <div className="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500"></div>
                  </div>
                ) : movies.length === 0 ? (
                  <div className="text-center py-20 text-slate-400">
                    <p className="text-lg">No movies found for {providerName} in Canada right now.</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                    {movies.map((movie) => (
                      <Link key={movie.id} to={`/movie/${movie.id}`} className="group flex flex-col bg-slate-900/60 rounded-xl overflow-hidden border border-white/10 hover:border-purple-500/50 transition transform hover:scale-105">
                        <div className="aspect-[2/3] w-full bg-slate-800 relative overflow-hidden">
                          {movie.poster_path ? (
                            <img 
                              src={`https://image.tmdb.org/t/p/w500${movie.poster_path}`} 
                              alt={movie.title} 
                              className="w-full h-full object-cover group-hover:opacity-90 transition"
                            />
                          ) : (
                            <div className="flex items-center justify-center h-full text-xs text-slate-500">No Image</div>
                          )}
                        </div>
                        <div className="p-3 flex flex-col flex-grow">
                          <h2 className="text-sm font-bold truncate text-white group-hover:text-purple-400 transition">{movie.title}</h2>
                          <p className="text-xs text-slate-400 mt-1">{movie.release_date ? movie.release_date.split('-')[0] : 'N/A'}</p>
                        </div>
                      </Link>
                    ))}
                  </div>
                )}
              </div>
            )
          }
          EOF

          # 2. Patch __root.tsx to include centered, theme-gradient pill tabs using TanStack <Link>
          ROOT_FILE="src/routes/__root.tsx"
          if [ -f "$ROOT_FILE" ]; then
            echo "Patching $ROOT_FILE with centered, themed gradient provider pill tabs..."
            node -e '
              const fs = require("fs");
              let content = fs.readFileSync("src/routes/__root.tsx", "utf8");
              
              const providerNavJSX = `
                <div className="flex items-center justify-center gap-6 px-6 py-4 bg-slate-950/95 border-b border-white/10 shrink-0 z-50 shadow-xl">
                  <Link to="/" className="px-5 py-2 text-sm font-bold rounded-full bg-gradient-to-r from-slate-800 to-slate-900 text-slate-200 border border-white/10 hover:border-slate-500 shadow-md transition-all">All</Link>
                  <Link to="/providers/8" className="px-6 py-2.5 text-sm font-extrabold rounded-full bg-gradient-to-r from-red-600 to-rose-900 text-white border border-red-500/40 shadow-lg shadow-red-900/40 hover:scale-105 transition-all">Netflix</Link>
                  <Link to="/providers/9" className="px-6 py-2.5 text-sm font-extrabold rounded-full bg-gradient-to-r from-sky-600 to-blue-900 text-white border border-sky-500/40 shadow-lg shadow-sky-900/40 hover:scale-105 transition-all">Prime Video</Link>
                  <Link to="/providers/337" className="px-6 py-2.5 text-sm font-extrabold rounded-full bg-gradient-to-r from-blue-700 to-indigo-900 text-white border border-blue-500/40 shadow-lg shadow-blue-900/40 hover:scale-105 transition-all">Disney+</Link>
                </div>
              `;

              if (content.includes("<header")) {
                content = content.replace("<header", providerNavJSX + "\n<header");
              } else if (content.includes("<nav")) {
                content = content.replace("<nav", providerNavJSX + "\n<nav");
              } else {
                content = content.replace(/return\s*\(\s*<\w+>/, match => match + "\n" + providerNavJSX);
              }

              fs.writeFileSync("src/routes/__root.tsx", content, "utf8");
              console.log("Successfully patched __root.tsx.");
            '
          fi

      - name: Create Temporary index.html with Floating Back Button & Player Detector
        run: |
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>RABBiT TV (Fire TV Edition)</title>
              <style>
                #firetv-back-to-home {
                  position: fixed !important;
                  top: 24px !important;
                  left: 24px !important;
                  z-index: 2147483647 !important;
                  background: rgba(15, 23, 42, 0.95) !important;
                  border: 2px solid rgba(168, 85, 247, 0.8) !important;
                  color: #ffffff !important;
                  padding: 12px 24px !important;
                  border-radius: 50px !important;
                  font-family: system-ui, -apple-system, sans-serif !important;
                  font-size: 16px !important;
                  font-weight: 700 !important;
                  cursor: pointer !important;
                  opacity: 0 !important;
                  pointer-events: none !important;
                  transition: opacity 0.25s ease-in-out, transform 0.2s ease !important;
                  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8) !important;
                }
                #firetv-back-to-home.visible {
                  opacity: 1 !important;
                  pointer-events: auto !important;
                }
                #firetv-back-to-home:hover, #firetv-back-to-home:focus {
                  background: rgba(168, 85, 247, 0.9) !important;
                  transform: scale(1.05) !important;
                }
              </style>
            </head>
            <body>
              <button id="firetv-back-to-home" onclick="if(window.history.length > 1){ window.history.back(); } else { window.location.replace('/'); }">
                ← Back to Home
              </button>
              <div id="root"></div>
              <script type="module" src="/src/entry-client.tsx"></script>
              <script>
                (function() {
                  let hideTimer;
                  function showBackButton() {
                    const hasPlayer = window.location.pathname.includes('/watch') || 
                                      window.location.pathname.includes('/player') || 
                                      document.querySelector('iframe, video, .video-player-container');
                    if (!hasPlayer) return;

                    const btn = document.getElementById('firetv-back-to-home');
                    if (!btn) return;

                    btn.classList.add('visible');
                    clearTimeout(hideTimer);
                    hideTimer = setTimeout(() => {
                      btn.classList.remove('visible');
                    }, 3500);
                  }

                  window.addEventListener('mousemove', showBackButton, { passive: true });
                  window.addEventListener('touchstart', showBackButton, { passive: true });
                  window.addEventListener('keydown', showBackButton, { passive: true });
                })();
              </script>
            </body>
          </html>
          EOF

      - name: Inject Clean Player CSS into Stylesheet
        run: |
          if [ -f src/styles.css ]; then
            echo "" >> src/styles.css
            echo "/* ==========================================================" >> src/styles.css
            echo "   Fire TV Player Adjustments" >> src/styles.css
            echo "   ================================================---------- */" >> src/styles.css
            echo "iframe, video, .video-player-container {" >> src/styles.css
            echo "  width: 100% !important;" >> src/styles.css
            echo "  height: 100% !important;" >> src/styles.css
            echo "  border: none !important;" >> src/styles.css
            echo "}" >> src/styles.css
            echo "Successfully injected player styles into src/styles.css"
          else
            echo "Error: src/styles.css not found!"
            exit 1
          fi

      - name: Build Web Assets for Capacitor
        env:
          CAPACITOR_BUILD: "true"
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          VITE_TMDB_READ_TOKEN: ${{ secrets.VITE_TMDB_READ_TOKEN }}
        run: npx vite build

      - name: Map TanStack Shell to Capacitor index.html
        run: |
          if [ -f dist/client/_shell.html ]; then
            cp dist/client/_shell.html dist/client/index.html
            echo "Successfully copied _shell.html to index.html"
          elif [ ! -f dist/client/index.html ]; then
            echo "Error: Could not find _shell.html or index.html in dist/client"
            ls -R dist/ || true
            exit 1
          fi

      - name: Create Dummy www Folder for Capacitor Init
        run: |
          mkdir -p www
          cp dist/client/index.html www/index.html

      - name: Add Android Platform
        run: npx @capacitor/cli add android

      - name: Generate App Icons and Splash Screens from Standard Assets
        run: npx @capacitor/assets generate --android

      - name: Sync Capacitor
        run: npx @capacitor/cli sync android

      - name: Dynamically Patch MainActivity for Fullscreen & Media Playback
        run: |
          mkdir -p android/app/src/main/java/com/rabbittv/app
          cat << 'EOF' > android/app/src/main/java/com/rabbittv/app/MainActivity.java
          package com.rabbittv.app;

          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private View mCustomView;
              private WebChromeClient.CustomViewCallback mCustomViewCallback;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebView webView = this.bridge.getWebView();
                      WebSettings settings = webView.getSettings();
                      
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setMediaPlaybackRequiresUserGesture(false);
                      settings.setAllowFileAccess(true);
                      settings.setAllowContentAccess(true);

                      webView.setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onShowCustomView(View view, CustomViewCallback callback) {
                              if (mCustomView != null) {
                                  callback.onCustomViewHidden();
                                  return;
                              }
                              mCustomView = view;
                              mCustomViewCallback = callback;

                              getWindow().getDecorView().setSystemUiVisibility(
                                  View.SYSTEM_UI_FLAG_LAYOUT_STABLE |
                                  View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                                  View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                                  View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                                  View.SYSTEM_UI_FLAG_FULLSCREEN |
                                  View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              );

                              ViewGroup decorView = (ViewGroup) getWindow().getDecorView();
                              decorView.addView(mCustomView, new ViewGroup.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                              ));
                              webView.setVisibility(View.GONE);
                          }

                          @Override
                          public void onHideCustomView() {
                              if (mCustomView == null) return;

                              ViewGroup decorView = (ViewGroup) getWindow().getDecorView();
                              decorView.removeView(mCustomView);
                              mCustomView = null;
                              
                              if (mCustomViewCallback != null) {
                                  mCustomViewCallback.onCustomViewHidden();
                              }

                              webView.setVisibility(View.VISIBLE);
                              getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                          }
                      });
                  }
              }

              @Override
              public void onBackPressed() {
                  if (mCustomView != null) {
                      onHideCustomView();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF
          echo "Successfully generated custom fullscreen MainActivity.java during build."

      - name: Copy TV Banner & Manifest Overrides
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/tv_banner.png android/app/src/main/res/drawable/tv_banner.png
          cp patches/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>

              <style name="AppTheme.NoActionBar" parent="AppTheme">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
              </style>

              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:windowBackground">#050b16</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/tv_banner</item>
                  <item name="android:windowSplashScreenBackground">#050b16</item>
              </style>
          </resources>
          EOF

      - name: Verify Android Directory Exists
        run: |
          if [ ! -d android ]; then
            echo "Error: android directory was not created!"
            exit 1
          fi

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Rename and Prepare APK Artifact
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/${{ steps.version-extractor.outputs.apk_filename }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version-extractor.outputs.artifact_name }}
          path: output_apk/${{ steps.version-extractor.outputs.apk_filename }}
